<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon cerveau, mode d'emploi — Classe NeuroVivia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EE; --card:#FFFFFF; --ink:#1F2544; --muted:#636884; --line:#E9E0D2;
  --pink:#E2557F; --pink-soft:#FCE4EC; --teal:#139C9E; --teal-soft:#DDF4F3;
  --green:#2E9E5B; --green-soft:#E3F4EA; --yellow:#F4BE3A; --yellow-soft:#FDF3D6;
  --violet:#6D4BD8; --violet-soft:#ECE6FC; --red:#D93A3A;
  --lv0:#1B8A4B; --lv1:#86BC3F; --lv2:#F29D0B; --lv3:#D93A3A;
  --radius:18px; --shadow:0 6px 22px rgba(31,37,68,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.55}
h1,h2,h3,h4{font-family:Fredoka,Nunito,system-ui,sans-serif;line-height:1.2;margin:0 0 .5em}
button{font:inherit;cursor:pointer}
a{color:var(--teal)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(251,246,238,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:62px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:1.15rem;cursor:pointer}
.brand .logo{width:38px;height:38px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-size:1.3rem}
.brand small{display:block;font-family:Nunito;font-weight:700;font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.spacer{flex:1}
.pill{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:.9rem}
.pill.on{background:var(--ink);color:#fff}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 14px;font-weight:800;font-size:.88rem}
.seg button.on{background:var(--ink);color:#fff}
.badges-mini{font-weight:800;font-size:.95rem;white-space:nowrap}
.prog{height:6px;background:var(--line)}
.prog>div{height:100%;background:linear-gradient(90deg,var(--teal),var(--pink));transition:width .5s}
main{padding:24px 0 60px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px;border:1px solid #F1EADF}
.muted{color:var(--muted)}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:800;background:var(--ink);color:#fff;transition:transform .1s, box-shadow .1s;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.teal{background:var(--teal)} .btn.pink{background:var(--pink)} .btn.green{background:var(--green)} .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink);box-shadow:none}
.btn.small{padding:8px 14px;font-size:.9rem;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
input[type=text],textarea{width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#FFFDF9;color:var(--ink)}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--teal)}
textarea{min-height:76px;resize:vertical}
label.lbl{font-weight:800;display:block;margin:10px 0 6px}
.tag{display:inline-block;font-size:.75rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--teal-soft);color:#0B6E70}
/* home map */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:2.3rem}
.hero .big{font-size:1.1rem}
.map{position:relative;display:grid;gap:14px}
.stop{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:center;background:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);border:2px solid transparent;cursor:pointer;transition:transform .15s,border-color .15s;text-align:left;width:100%;color:var(--ink)}
.stop:hover:not(.locked){transform:translateY(-2px);border-color:var(--ink)}
.stop .ico{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:2rem}
.stop h3{margin:0 0 2px;font-size:1.2rem}
.stop p{margin:0;color:var(--muted);font-size:.95rem}
.stop .st{font-weight:800;font-size:.85rem;white-space:nowrap}
.stop.locked{opacity:.55;cursor:not-allowed;filter:grayscale(.5)}
.stop.done{border-color:var(--green)}
@media(max-width:560px){.stop{grid-template-columns:52px 1fr}.stop .st{grid-column:2}.stop .ico{width:52px;height:52px;font-size:1.6rem}}
/* neura speech */
.neura{display:grid;grid-template-columns:84px 1fr;gap:16px;align-items:start}
.neura .av{width:84px;height:84px;border-radius:50%;background:var(--pink-soft);display:grid;place-items:center;font-size:2.8rem;border:3px solid var(--pink)}
.neura .bub{background:var(--pink-soft);border-radius:4px 18px 18px 18px;padding:16px 18px;position:relative}
.neura .who{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;color:var(--pink);margin-bottom:4px}
@media(max-width:560px){.neura{grid-template-columns:1fr}.neura .av{width:64px;height:64px;font-size:2rem}}
.probleme{border-left:6px solid var(--yellow);background:var(--yellow-soft);border-radius:12px;padding:14px 18px;font-weight:700;font-size:1.08rem}
.obj li{margin:4px 0}
/* tabs */
.esc-head{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.esc-head .ico{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:1.9rem}
.esc-head h1{margin:0;font-size:1.7rem}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.tabs button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:800;font-size:.9rem;color:var(--ink)}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tabs button.ok::after{content:" ✓";color:var(--green)}
.tabs button.on.ok::after{color:#9BE5B6}
.navbtns{display:flex;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}
/* discover cards */
.disc{border-radius:var(--radius);padding:18px;background:#fff;border:2px solid var(--line);height:100%}
.disc .di{font-size:2rem}
.disc h3{font-size:1.15rem;margin:.3em 0 .4em}
.disc p{margin:.3em 0}
.key{background:var(--teal-soft);border-radius:12px;padding:12px 14px;font-weight:700;margin-top:10px}
/* quiz */
.qwrap{max-width:860px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
.qq{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:1.45rem;text-align:center;background:#fff;border-radius:var(--radius);padding:26px 20px;box-shadow:var(--shadow);margin-bottom:16px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.answers{grid-template-columns:1fr}}
.ans{border:0;border-radius:14px;padding:18px 18px 18px 58px;color:#fff;font-weight:800;font-size:1.05rem;text-align:left;position:relative;min-height:74px;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:opacity .2s,transform .1s}
.ans::before{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:1.5rem}
.ans.a0{background:#D9435A}.ans.a0::before{content:"▲"}
.ans.a1{background:#2F6FD6}.ans.a1::before{content:"◆"}
.ans.a2{background:#C99A06}.ans.a2::before{content:"●"}
.ans.a3{background:#25924F}.ans.a3::before{content:"■"}
.ans.dim{opacity:.3}
.ans.right{outline:5px solid var(--ink);outline-offset:2px}
.fb{margin-top:16px;border-radius:14px;padding:14px 18px;font-weight:700}
.fb.ok{background:var(--green-soft);border:2px solid var(--green)}
.fb.ko{background:#FDE7E7;border:2px solid var(--red)}
.score-big{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:3rem;font-weight:700;text-align:center}
/* autoeval */
.crit{border:2px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;background:#fff}
.crit h4{font-size:1.08rem;margin-bottom:6px}
.crit ul{margin:6px 0 12px;padding-left:20px}
.lvls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:620px){.lvls{grid-template-columns:1fr 1fr}}
.lv{border:3px solid transparent;border-radius:12px;padding:10px 8px;font-weight:800;font-size:.88rem;color:#fff;text-align:center;opacity:.55;line-height:1.25}
.lv small{display:block;font-weight:600;font-size:.76rem;opacity:.95;margin-top:3px}
.lv.l0{background:var(--lv0)}.lv.l1{background:var(--lv1)}.lv.l2{background:var(--lv2)}.lv.l3{background:var(--lv3)}
.lv.on{opacity:1;border-color:var(--ink);transform:scale(1.03)}
.hint{font-size:.9rem;background:var(--violet-soft);border-radius:10px;padding:8px 12px;margin-bottom:10px}
/* memo */
.memo-item{border:2px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#fff}
.memo-item .q{font-weight:800;margin-bottom:6px}
.model{display:none;margin-top:8px;background:var(--green-soft);border-radius:10px;padding:10px 12px;font-size:.95rem}
.model.show{display:block}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,22,40,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
.modal{background:#fff;border-radius:22px;max-width:760px;width:100%;padding:26px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .x{position:absolute;right:14px;top:12px;border:0;background:var(--bg);width:38px;height:38px;border-radius:50%;font-size:1.2rem;font-weight:800}
.res h3{color:var(--teal);margin-top:1em}
.res ul{padding-left:20px}
.res li{margin:4px 0}
.vocab{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem}
.vocab b{white-space:nowrap}
/* jungle */
.jungle svg{width:100%;height:auto;display:block;border-radius:16px;background:#CFE8C4}
.lvl-label{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:1.25rem;margin:10px 0 2px}
/* order */
.order-pool,.order-done{display:grid;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:700;text-align:left;color:var(--ink);width:100%}
.chip:hover{border-color:var(--teal)}
.chip.placed{background:var(--green-soft);border-color:var(--green);cursor:default}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* stroop & trail */
.lab{background:#1F2544;color:#fff;border-radius:18px;padding:20px;text-align:center}
.lab .word{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:3.4rem;margin:18px 0;letter-spacing:.04em;background:#fff;border-radius:14px;padding:10px}
.lab .cbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lab .cbtns button{border:0;border-radius:12px;padding:14px 6px;font-weight:800;color:#fff;font-size:1rem}
.res-bars{display:grid;gap:8px;margin-top:12px}
.bar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-weight:700;font-size:.92rem}
.bar .b{height:22px;border-radius:8px;background:var(--teal);transition:width .6s}
@media(max-width:560px){.bar{grid-template-columns:90px 1fr 60px}}
.trail{position:relative;height:340px;background:#fff;border:2px dashed var(--line);border-radius:16px;margin:12px 0;overflow:hidden}
.dot{position:absolute;width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-weight:800;font-size:1.1rem;display:grid;place-items:center;color:var(--ink);padding:0}
.dot.ok{background:var(--green);color:#fff;border-color:var(--green)}
.dot.bad{background:var(--red);color:#fff}
/* classify */
.cls-item{border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:#fff}
.cls-item .opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.opt{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:.9rem;color:var(--ink)}
.opt.good{background:var(--green);border-color:var(--green);color:#fff}
.opt.bad{background:var(--red);border-color:var(--red);color:#fff}
.opt.sel{background:var(--ink);color:#fff}
.mini-fb{font-size:.9rem;margin-top:6px;font-weight:700}
/* checks */
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;cursor:pointer;font-weight:700}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--teal)}
.check.on{border-color:var(--teal);background:var(--teal-soft)}
/* film */
.film{background:#14172B;border-radius:20px;padding:14px;color:#fff}
.screen{position:relative;background:linear-gradient(#FFF8EC,#FBEBD3);border-radius:14px;min-height:330px;overflow:hidden;color:var(--ink);padding:16px}
.screen .day{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:1.25rem;text-align:center;margin-bottom:10px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.duo{grid-template-columns:1fr}}
.char{background:#fff;border-radius:14px;padding:12px;text-align:center;animation:pop .5s both}
.char .face{font-size:3rem;line-height:1}
.char .nm{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700}
.char .act{font-size:.95rem;margin-top:6px}
.char .say{display:inline-block;margin-top:8px;background:var(--yellow-soft);border-radius:12px;padding:6px 10px;font-weight:800;font-size:.92rem}
.char.leo{border:3px solid #E2557F}.char.ines{border:3px solid #139C9E}
.screen .narr{margin-top:12px;background:var(--ink);color:#fff;border-radius:12px;padding:10px 14px;font-weight:700;text-align:center;animation:pop .6s .4s both}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.film .ctrl{display:flex;align-items:center;gap:10px;margin-top:12px}
.film .ctrl button{border:0;background:#fff;color:#14172B;border-radius:10px;padding:8px 14px;font-weight:800}
.film .track{flex:1;height:8px;background:#3A3F60;border-radius:8px;overflow:hidden}
.film .track>div{height:100%;background:var(--yellow);width:0}
/* myths */
.myths{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.myth{border-radius:18px;padding:16px;background:#fff;border:3px solid var(--line);display:flex;flex-direction:column}
.myth .stmt{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:1.12rem;flex:1}
.myth .vf{display:flex;gap:8px;margin-top:12px}
.myth .vf button{flex:1;border:0;border-radius:12px;padding:10px;font-weight:800;color:#fff}
.myth.won{border-color:var(--green)} .myth.lost{border-color:var(--red)}
.verdict{margin-top:10px;font-size:.93rem;animation:pop .4s both}
.verdict b.v{color:var(--green)} .verdict b.f{color:var(--red)}
/* ad */
.ad{background:linear-gradient(135deg,#2B0F4C,#6D1F7A);color:#fff;border-radius:20px;padding:24px;font-family:Nunito}
.ad h3{font-size:2rem;color:#FFE45C;margin-bottom:4px;letter-spacing:.02em}
.ad .claim{display:block;width:100%;text-align:left;border:2px dashed rgba(255,255,255,.35);background:rgba(255,255,255,.07);color:#fff;border-radius:12px;padding:10px 14px;margin:8px 0;font-weight:700;font-size:1rem}
.ad .claim:hover{border-color:#FFE45C}
.ad .claim.myth-found{background:#D93A3A;border:2px solid #fff;text-decoration:line-through}
.ad .claim.true-found{background:#25924F;border:2px solid #fff}
.ad .stamp{font-size:.8rem;opacity:.7}
/* clôture */
.cmp{width:100%;border-collapse:collapse;font-size:.95rem}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
.cmp th{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600}
.v{color:var(--green);font-weight:800}.f{color:var(--red);font-weight:800}
.strat{border:3px solid var(--line);border-radius:16px;padding:14px;background:#fff;cursor:pointer;text-align:left;color:var(--ink);width:100%}
.strat.on{border-color:var(--teal);background:var(--teal-soft)}
.strat .si{font-size:1.8rem}
.strat b{display:block;margin:4px 0}
.flash{max-width:640px;margin:0 auto;text-align:center}
.flash .fq{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:1.35rem;background:var(--violet-soft);border-radius:18px;padding:24px}
.badge-row{display:flex;gap:12px;flex-wrap:wrap}
.bdg{display:flex;align-items:center;gap:10px;border-radius:999px;padding:6px 16px 6px 6px;background:#fff;border:2px solid var(--line);font-weight:800}
.bdg span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem}
.bdg.off{opacity:.35;filter:grayscale(1)}
/* slides (projection) */
.slides{position:fixed;inset:0;top:0;background:var(--bg);z-index:30;display:flex;flex-direction:column}
.slides .stage{flex:1;display:flex;padding:3vh 5vw;overflow:auto}
.slide{width:100%;max-width:1400px;margin:auto;animation:pop .45s both}
.slide h1{font-size:clamp(2rem,5vw,4.6rem)}
.slide h2{font-size:clamp(1.6rem,3.6vw,3.2rem)}
.slide p,.slide li{font-size:clamp(1.1rem,2.1vw,1.9rem)}
.slide .aff{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:clamp(1.8rem,4.4vw,4rem);text-align:center;background:#fff;border-radius:28px;padding:5vh 4vw;box-shadow:var(--shadow);line-height:1.25}
.slide .vote{display:flex;gap:3vw;justify-content:center;margin-top:4vh}
.slide .vote div{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:clamp(1.4rem,3vw,2.6rem);padding:2vh 4vw;border-radius:22px;color:#fff}
.slide .reveal{margin-top:3vh;text-align:center;font-size:clamp(1.1rem,2vw,1.7rem);background:var(--ink);color:#fff;border-radius:18px;padding:2vh 2vw;animation:pop .4s both}
.slides .bar-bottom{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--line);background:#fff;flex-wrap:wrap}
.slides .dots{flex:1;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.slides .dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.slides .dots i.on{background:var(--pink)}
.rules{display:grid;gap:2vh;counter-reset:r}
.rules div{background:#fff;border-radius:20px;padding:2vh 2vw;font-size:clamp(1.1rem,2.2vw,2rem);font-weight:800;box-shadow:var(--shadow);display:flex;gap:2vw;align-items:center}
.rules div span{font-size:clamp(1.6rem,3vw,2.8rem)}
.prog-slide{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:2vw}
.prog-slide div{background:#fff;border-radius:22px;padding:2.5vh 1.5vw;box-shadow:var(--shadow)}
.prog-slide .pi{font-size:clamp(2rem,4vw,3.4rem)}
.prog-slide b{font-family:Fredoka,Nunito,system-ui,sans-serif;font-size:clamp(1.1rem,1.9vw,1.7rem);display:block;margin:.4em 0}
.prog-slide p{font-size:clamp(.95rem,1.4vw,1.25rem);margin:0;color:var(--muted)}
/* footer */
footer{border-top:1px solid var(--line);padding:22px 0;color:var(--muted);font-size:.88rem}
footer .row{justify-content:space-between}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;font-weight:700;padding:0;font-size:.88rem}
/* confetti */
.conf{position:fixed;top:-12px;width:10px;height:16px;z-index:100;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.badge-pop{text-align:center}
.badge-pop .medal{width:130px;height:130px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;font-size:4rem;border:6px solid var(--yellow);animation:pop .6s both}
/* ---- v2 : illustrations, vidéos, déroulé, projection par séance ---- */
.mascot{width:100%;height:100%;display:block}
.neura .av{background:#fff;padding:4px;overflow:hidden}
.logo-mary{display:block;width:46px;height:46px;flex:none}
.brand-logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.8rem;color:var(--muted)}
.vcard{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px;text-decoration:none;color:var(--ink);margin:0 0 18px;transition:border-color .15s,transform .15s}
.vcard:hover{border-color:var(--pink);transform:translateY(-2px)}
.vthumb{position:relative;aspect-ratio:16/9;border-radius:12px;background-color:#6D4BD8;background-image:linear-gradient(135deg,#139C9E,#6D4BD8);background-size:cover;background-position:center;display:grid;place-items:center;overflow:hidden}
.vthumb .mini{width:46%;opacity:.95}
.vthumb .play{position:absolute;width:58px;height:58px;border-radius:50%;background:rgba(226,85,127,.96);color:#fff;display:grid;place-items:center;font-size:1.4rem;box-shadow:0 4px 16px rgba(0,0,0,.35);padding-left:4px}
.vinfo b{display:block;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:1.2rem;margin:6px 0 2px}
.vinfo small{display:block;font-weight:700;color:var(--muted)}
.vcard.big{grid-template-columns:1.2fr 1fr;max-width:1200px;margin:0 auto;padding:18px}
.vcard.big .vinfo b{font-size:clamp(1.3rem,2.6vw,2.4rem)}
.vcard.big .vinfo small{font-size:clamp(.95rem,1.4vw,1.25rem)}
.vcard.big .play{width:110px;height:110px;font-size:3rem}
@media(max-width:700px){.vcard,.vcard.big{grid-template-columns:1fr}}
.deroule{display:grid;grid-template-columns:1fr auto 1.3fr auto 1fr;gap:10px;align-items:stretch;margin-bottom:18px}
.dstep{border-radius:16px;padding:12px 14px;text-align:center}
.dstep span{font-size:1.9rem;display:block;line-height:1.1}
.dstep b{display:block;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:1.05rem;margin:4px 0 2px}
.dstep small{color:var(--muted);font-weight:700;font-size:.85rem}
.dstep.proj{background:var(--yellow-soft);border:2px solid var(--yellow)}
.dstep.solo{background:var(--teal-soft);border:2px solid var(--teal)}
.darrow{display:grid;place-items:center;font-size:1.5rem;font-weight:800;color:var(--muted)}
@media(max-width:760px){.deroule{grid-template-columns:1fr}.darrow{transform:rotate(90deg)}}
.art{border-radius:20px;overflow:hidden;margin-bottom:18px;box-shadow:var(--shadow)}
.art svg{display:block;width:100%;height:auto}
.lobes svg{width:100%;height:auto;display:block}
.lobe{cursor:pointer;transition:opacity .25s,filter .2s}
.lobe:hover{filter:brightness(1.12)}
.lobes.sel .lobe{opacity:.35}
.lobes.sel .lobe.on{opacity:1}
.net svg{width:100%;height:auto;background:#1F2544;border-radius:16px;display:block}
.spot-stage{position:relative;background:#14172B;border-radius:18px;padding:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.spot-stage .it{border:0;background:#2A2E52;color:#fff;border-radius:16px;padding:16px 8px;font-weight:800;font-size:1rem;transition:opacity .35s,transform .35s,box-shadow .35s,background .35s}
.spot-stage .it span{font-size:2.6rem;display:block;line-height:1.2}
.spot-stage.on .it{opacity:.18}
.spot-stage.on .it.lit{opacity:1;background:#FFF3C4;color:var(--ink);transform:scale(1.07);box-shadow:0 0 50px 14px rgba(255,226,130,.6)}
@media(max-width:560px){.spot-stage{grid-template-columns:repeat(2,1fr)}}
.seances{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2vw;margin-top:3vh}
.seances button{border:3px solid transparent;background:#fff;border-radius:24px;padding:3vh 1.5vw;box-shadow:var(--shadow);text-align:left;color:var(--ink);transition:transform .15s,border-color .15s}
.seances button:hover{transform:translateY(-3px);border-color:var(--pink)}
.seances .si{font-size:clamp(2.2rem,4vw,3.6rem)}
.seances b{display:block;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:clamp(1.2rem,2vw,1.8rem);margin:.3em 0 .2em}
.seances span.s{display:block;color:var(--muted);font-weight:700;font-size:clamp(.95rem,1.3vw,1.2rem)}
.cd{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:clamp(3.5rem,10vw,8.5rem);text-align:center;line-height:1}
.avous{display:grid;grid-template-columns:1.1fr 1fr;gap:3vw;align-items:center}
@media(max-width:800px){.avous{grid-template-columns:1fr}}
.avous ol{margin:0;padding-left:1.2em}
.avous li{margin:.35em 0}
.pt-q{background:#fff;border-radius:20px;padding:2vh 2vw;box-shadow:var(--shadow);margin-bottom:2vh}
.pt-q .qt{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:clamp(1.2rem,2.3vw,2.1rem)}
.pt-q .an{margin-top:1.2vh;background:var(--green-soft);border-radius:14px;padding:1.2vh 1.4vw;font-size:clamp(1rem,1.8vw,1.6rem);animation:pop .4s both}
.collword{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:700;font-size:clamp(4rem,13vw,11rem);text-align:center;background:#fff;border-radius:30px;padding:2vh 2vw;box-shadow:var(--shadow);letter-spacing:.04em;margin:3vh 0}

/* aperçu enseignant */
.pv-band{background:var(--yellow);color:var(--ink);font-size:.92rem}
.pv-band .row{padding-top:6px;padding-bottom:6px;gap:12px}
body.preview #app :is(input,textarea){pointer-events:none;background:#F2F0EC;color:var(--muted)}
body.preview #app :is(.opt:not(span),.ans,.lv,.check,.strat,.chip,.claim,.myth .vf button,.lab button,.trail .dot),
body.preview #app button:is([onclick^="trStart"],[onclick^="finishEscale"],[onclick^="carteSave"],[onclick^="cartePrint"],[onclick^="unlockNext"],[onclick^="finishClo"],[onclick^="printCert"],[onclick^="fcMark"],[onclick^="setLI"]){pointer-events:none;opacity:.5;filter:grayscale(.4)}

.slide .att-h{justify-content:center}
.slide .att-h::before{width:clamp(48px,5vw,80px);height:clamp(86px,9vw,144px)}
/* carte synthèse */
.carte-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:18px;align-items:start}
@media(max-width:900px){.carte-grid{grid-template-columns:1fr}}
.carte-prev{position:sticky;top:150px;background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid #F1EADF}
@media(max-width:900px){.carte-prev{position:static}}
.cv{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line)}
.br-item{background:#fff;border:2px solid var(--line);border-left:8px solid var(--bc);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.br-h{font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:1.08rem;color:var(--bc);margin-bottom:2px}
.kws{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.kw{border:2px dashed var(--line);border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:800;color:var(--muted)}
.kw.on{border-style:solid;border-color:var(--green);background:var(--green-soft);color:#1B6B3D}
/* onglets missions */
.mtabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}
.mtab{flex:1 1 0;min-width:96px;position:relative;border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 12px;font-weight:800;font-size:.9rem;color:var(--ink);text-align:left;line-height:1.2;transition:border-color .15s,background .15s}
.mtab span{margin-right:6px;font-size:1.1rem}
.mtab small{display:block;font-weight:700;font-size:.72rem;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.mtab:hover:not(.locked){border-color:var(--ink)}
.mtab.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:inset 0 -5px 0 var(--mc,var(--pink))}
.mtab.on small{color:#C9CCE0}
.mtab.done{border-color:var(--green)}
.mtab.done i{position:absolute;top:-7px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-style:normal;font-size:.8rem;display:grid;place-items:center}
.mtab.locked{opacity:.5;cursor:not-allowed}
/* print */
#print-area{display:none}
@media print{
  body{background:#fff}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block!important;font-size:12pt}
  .cert{border:6px double #1F2544;border-radius:20px;padding:28px;text-align:center;margin-bottom:20px;page-break-inside:avoid}
  .pa-table{width:100%;border-collapse:collapse;margin:8px 0 16px}
  .pa-table td,.pa-table th{border:1px solid #bbb;padding:6px 8px;text-align:left;vertical-align:top;font-size:10.5pt}
  .lvl-chip{display:inline-block;padding:2px 8px;border-radius:6px;color:#fff;font-weight:800;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

<script>
/* =========================================================

   (ex. « La pire stratégie d'étude »), collez-le entre les
   guillemets : un bouton apparaîtra dans la Mission 4.
   ========================================================= */
const CONFIG = {
  videoBonusTitre: "La pire stratégie d'étude",
  videoBonusLien: "",
  codeEnseignant: "VIVIA"   // code pour ouvrir le mode aperçu enseignant
};

const EPISODES = [
  ["Épisode 1","https://view.genial.ly/5ecbbeafc4940d0d027e7b88/interactive-content-lecerveauepisode1"],
  ["Épisode 2","https://view.genial.ly/5ebc1a13e87b0e0d2560952f/interactive-content-lecerveauepisode2"],

/* ================= STATE ================= */
const KEY = "neurovivia_parcours_v1";
const blank = () => ({carte:{}, carteSaved:{}, name:"", unlocked:5, done:{}, quiz:{}, auto:{}, memo:{}, act:{}, before:[], after:[], strategies:[], stratDetail:{}, flash:{}});
let S;
try { S = Object.assign(blank(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch(e){ S = blank(); }
S.unlocked = 5; // toutes les missions sont accessibles librement
function save(){ if(typeof V!=="undefined" && V.preview) return; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
/* ---- Mode aperçu enseignant : tout est ouvert, rien n'est faisable ni enregistré ---- */
let REAL_S = null;
function askPreview(){
  modal(`<div class="row">${logo(56)}<h2 style="margin:0">👁️ Aperçu des missions</h2></div>
  <p>Consultez toutes les missions sans les faire : les contenus, les activités, les questions et leurs réponses. Rien ne peut être rempli ni validé, et rien n'est enregistré.</p>
  <label class="lbl" for="pcode">Code enseignant</label>

}

function missionTabsHTML(){
  return `<div class="wrap"><nav class="mtabs" aria-label="Missions">
    <button class="mtab ${V.page==="home"?"on":""}" onclick="go('home')"><span>🗺️</span>Carte</button>
    ${STEPS.map((st,i)=>{ const locked = i> S.unlocked, done = S.done[st.id], on = V.page===st.id;
      const e = ESCALES.find(x=>x.id===st.id);
      return `<button class="mtab ${on?"on":""} ${done?"done":""} ${locked?"locked":""}" ${locked?`title="Termine la mission précédente pour débloquer"`:""} onclick="${locked?`toast('🔒 Termine d’abord la mission précédente !')`:`go('${st.id}')`}" style="${on&&e?`--mc:${e.color}`:""}"><span>${locked?"🔒":MTAB[st.id][0]}</span>${MTAB[st.id][1]}${e?`<small>${e.title}</small>`:""}${done?'<i>✓</i>':""}</button>`; }).join("")}
  </nav></div>`;
}
function setMode(m){ V.mode=m; if(m==="proj"){ V.seance = null; V.slide = 0; } render(); }

/* ================= ROUTER ================= */
function go(page, tab){ V.page=page; V.tab=tab||0; render(); window.scrollTo({top:0,behavior:"smooth"}); const a=document.querySelector('.mtab.on'); if(a) a.scrollIntoView({block:'nearest',inline:'center'}); }
function render(){
  renderTop();
  const old = document.querySelector(".slides"); if(old) old.remove();
  const app = $("#app");
  if(V.mode==="proj"){ app.innerHTML = ""; renderSlides(); return; }
  if(!S.name){ app.innerHTML = welcomeHTML(); return; }
  if(V.page==="home") app.innerHTML = homeHTML();
  else if(V.page==="ouv") app.innerHTML = ouvHTML();
  else if(V.page==="clo") { app.innerHTML = cloHTML(); afterClo(); }
  else { const e = ESCALES.find(x=>x.id===V.page); app.innerHTML = escaleHTML(e); afterEscale(e); }
}

/* Vidéos */
const VIDEOS = {
  canotech:{titre:"Comment fonctionne le cerveau pour apprendre ?", source:"CanoTech", url:"https://www.canotech.fr/a/31570/comment-fonctionne-le-cerveau-pour-apprendre", note:"S'ouvre dans un nouvel onglet (connexion CanoTech parfois demandée)"},
  masson:{titre:"Aide ton cerveau à mieux apprendre !", source:"Steve Masson · Cerveau et apprentissage (YouTube)", url:"https://www.youtube.com/watch?v=tfXcUfP81w4", thumb:"https://i.ytimg.com/vi/tfXcUfP81w4/hqdefault.jpg", note:"S'entraîner, utiliser ses erreurs, croire en sa réussite"}
};
function videoCard(k, big){
  const v = VIDEOS[k];
  return `<a class="vcard ${big?"big":""}" href="${v.url}" target="_blank" rel="noopener">
    <div class="vthumb" ${v.thumb?`style="background-image:url('${v.thumb}'),linear-gradient(135deg,#139C9E,#6D4BD8)"`:""}>${v.thumb?"":`<div class="mini">${mascot()}</div>`}<span class="play">▶</span></div>
    <div class="vinfo"><span class="tag" style="background:var(--pink-soft);color:#A3264F">🎬 Vidéo</span><b>${v.titre}</b><small>${v.source}</small>${v.note?`<small style="font-weight:600">${v.note}</small>`:""}</div></a>`;
}

/* Déroulé d'une séance : ensemble → seul → ensemble */
function derouleHTML(e){
  return `<div class="deroule">
   <div class="dstep proj"><span>📽️</span><b>1 · Tous ensemble</b><small>Au tableau : lancement de la mission${e.video?" et vidéo":e.id==="e4"?" et film":e.id==="e3"?" et expérience collective":""}</small></div>
   <div class="darrow">➜</div>
   <div class="dstep solo"><span>💻</span><b>2 · Seul sur mon poste</b><small>Découvrir · Activités · ${e.vf?"Vrai ou faux":"Quiz"} · Mémo · Auto-évaluation</small></div>
   <div class="darrow">➜</div>
   <div class="dstep proj"><span>📽️</span><b>3 · Tous ensemble</b><small>Au tableau : on fait le point</small></div></div>`;
}

/* Bandeau illustré de mission */
function escaleArt(e){
  const acc = {e1:"🔬",e2:"🌱",e3:"🔦",e4:"🔍"}[e.id];
  const soft = {e1:"#DDF4F3",e2:"#E3F4EA",e3:"#ECE6FC",e4:"#FCE4EC"}[e.id];
  const strong = {e1:"#139C9E",e2:"#2E9E5B",e3:"#6D4BD8",e4:"#E2557F"}[e.id];
  const pts = [[470,30],[540,70],[610,28],[520,130],[600,118],[680,70],[740,30],[760,130],[430,110]];
  const links = [[0,1],[1,2],[1,3],[3,4],[4,5],[2,5],[5,6],[5,7],[0,8],[8,3]];
  const pattern = links.map(([a,b])=>`<line x1="${pts[a][0]}" y1="${pts[a][1]}" x2="${pts[b][0]}" y2="${pts[b][1]}" stroke="${strong}" stroke-width="3" opacity=".25"/>`).join("") + pts.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="8" fill="${strong}" opacity=".3"/>`).join("");
  return `<div class="art"><svg viewBox="0 0 800 160" role="img" aria-label="Mission ${e.num}"><rect width="800" height="160" fill="${soft}"/>${pattern}
  <g transform="translate(28,6) scale(1.22)">${mascotG()}</g>
  <text x="200" y="72" font-family="Fredoka,Nunito,Arial,sans-serif" font-weight="700" font-size="36" fill="#1F2544">Mission ${e.num}</text>
  <text x="200" y="108" font-family="Nunito,Arial,sans-serif" font-weight="800" font-size="19" fill="${strong}">${e.sub}</text>
  <text x="728" y="126" font-size="90" text-anchor="middle">${acc}</text></svg></div>`;
}

/* ================= OUVERTURE ================= */
function ouvHTML(){
  const all = AFFIRMATIONS.every((_,i)=>S.before[i]!=null);
  return `<div class="esc-head"><div class="ico" style="background:var(--yellow-soft)">🚪</div><div><span class="tag">Ouverture · individuel</span><h1>Mes idées de départ</h1></div><div class="spacer"></div><button class="btn ghost small" onclick="go('home')">← Carte</button></div>
  <div class="card">${neuraHTML(`Avant de commencer, je veux savoir ce que <b>tu</b> penses. Ici, il n'y a <b>ni bonne ni mauvaise réponse</b> : réponds honnêtement, sans chercher sur Internet. Tu reviendras sur tes réponses à la fin du parcours pour voir si tu as changé d'avis.`)}</div>
  <div class="card"><h2>Vrai ou faux ? À toi de dire ce que tu en penses</h2>
  ${AFFIRMATIONS.map((a,i)=>`<div class="cls-item"><b>${i+1}. ${a.t}</b><div class="opts">
    ${[["Vrai",true],["Faux",false],["Je ne sais pas","?"]].map(([l,v])=>`<button class="opt ${S.before[i]===v?"sel":""}" onclick="setBefore(${i},${JSON.stringify(v).replace(/"/g,"'")})">${l}</button>`).join("")}
  </div></div>`).join("")}
  <div class="navbtns"><span class="muted">${AFFIRMATIONS.filter((_,i)=>S.before[i]!=null).length}/6 réponses</span>
  <button class="btn pink" ${all?"":"disabled"} onclick="unlockNext('ouv');celebrate();go('e1')">J'ai répondu, je pars en Mission 1 ➜</button></div></div>`;
}
function setBefore(i,v){ S.before[i]=v; save(); render(); }

/* ================= ESCALE ================= */
function tabDone(e,t){
  if(t===0) return true;
  if(t===3) return !!S.quiz[e.id];
  if(t===4) return (S.memo[e.id]||[]).filter(x=>x&&x.trim()).length>=e.memo.length;
  if(t===5) return carteDone(e.id);
  if(t===6) return e.crit.every((_,i)=>(S.auto[e.id]||{})[i]!=null);
  return false;
}
function escaleHTML(e){
  const t = V.tab;
  let body = "";
  if(t===0) body = missionHTML(e);
  if(t===1) body = discoverHTML(e);
  if(t===2) body = activitiesHTML(e);
  if(t===3) body = e.vf ? vfHTML(e) : quizHTML(e);
  if(t===4) body = memoHTML(e);
  if(t===5) body = carteHTML(e);
  if(t===6) body = autoHTML(e);
  return `<div class="esc-head"><div class="ico" style="background:${e.soft}">${e.icon}</div>
    <div><span class="tag" style="background:${e.soft}">Mission ${e.num} · 💻 travail individuel</span><h1>${e.title}</h1></div>
    <div class="spacer"></div>
    <button class="btn teal small" onclick="openRes('${e.id}')">📚 Fiche ressource</button>
    <button class="btn ghost small" onclick="go('home')">← Carte</button></div>
  <div class="muted" style="font-weight:800;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;margin:-4px 0 6px">Les étapes de la mission ${e.num}</div>
  <div class="tabs">${TABS.map((n,i)=>`<button class="${i===t?"on":""} ${tabDone(e,i)&&i>0?"ok":""}" onclick="go('${e.id}',${i})">${i===3&&e.vf?"⚡ Vrai ou faux":n}</button>`).join("")}</div>
  ${body}
  <div class="navbtns">${t>0?`<button class="btn ghost" onclick="go('${e.id}',${t-1})">← Étape précédente</button>`:"<span></span>"}
  ${t<6?`<button class="btn" onclick="go('${e.id}',${t+1})">Étape suivante ➜</button>`:(S.done[e.id]?`<button class="btn pink" onclick="go('${STEPS[STEPS.findIndex(x=>x.id===e.id)+1].id}')">Mission suivante ➜</button>`:"")}</div>`;
}
function missionHTML(e){
  return `${escaleArt(e)}
  ${derouleHTML(e)}
  <div class="card">${neuraHTML(e.neura)}</div>
  <div class="grid2"><div class="card"><h3>❓ Problématique</h3><div class="probleme">${e.probleme}</div></div>
  <div class="card"><h3>🎯 À la fin de la mission, je serai capable de…</h3><ul class="obj">${e.objectifs.map(o=>`<li>${o}</li>`).join("")}</ul></div></div>
  <div class="card" style="background:${e.soft};border:0"><b>🗺️ Les étapes de ta mission (onglets ci-dessus) :</b> Découvrir → Activités → ${e.vf?"Vrai ou faux":"Quiz"} → Fiche de mémorisation → Auto-évaluation → Badge <b>${e.badge.icon} ${e.badge.name}</b>.<br><span class="muted">Bloqué ? Ouvre la <b>📚 Fiche ressource</b> en haut à droite.</span></div>`;
}
function discoverHTML(e){
  let before = "", extra = "";
  if(e.video) before = `<p class="muted" style="font-weight:700;margin:0 0 8px">🎬 La vidéo vue en classe (à revoir si besoin) :</p>${videoCard(e.video)}`;
  if(e.id==="e1"){ before += `<div class="card lobes-card"><h3>🧠 Ton cerveau, vu de côté : clique sur chaque zone</h3>${lobesHTML("lobinfo")}</div>`; extra = neuronHTML() + networkHTML(); }
  if(e.id==="e2") extra = erreurHTML();
  if(e.id==="e3") before += projectorHTML("prj");
  return `${before}<div class="grid3">${e.discover.map(d=>`<div class="disc"><div class="di">${d.i}</div><h3>${d.t}</h3>${d.h}</div>`).join("")}</div>
  ${extra}
  <div class="card" style="margin-top:18px"><b>🎬 Pour aller plus loin :</b> toutes les vidéos (dont la série <i>Un cerveau qui apprend</i>) sont dans la <button class="linkbtn" style="color:var(--teal);font-size:1rem" onclick="openVideotheque()">Vidéothèque</button>.</div>`;
}

/* ---------- Lobes du cerveau ---------- */
const LOBES = {
  frontal:["Lobe frontal","#5B8DEF","À l'avant, derrière ton front : c'est le chef d'orchestre. Il sert à réfléchir, décider, planifier, contrôler tes émotions… et à diriger ton attention (le cortex préfrontal)."],
  parietal:["Lobe pariétal","#E9A80F","En haut : il reçoit les sensations du corps (toucher, chaud, froid, douleur) et t'aide à te repérer dans l'espace. Il participe aussi au calcul."],
  temporal:["Lobe temporal","#2E9E5B","Sur le côté, au niveau des oreilles : il traite les sons et aide à comprendre le langage. À l'intérieur se cache l'hippocampe, essentiel pour la mémoire."],
  occipital:["Lobe occipital","#E2557F","À l'arrière de la tête : c'est le centre de la vision. Il analyse tout ce que tes yeux voient."],
  cervelet:["Cervelet","#6D4BD8","Sous l'arrière du cerveau : il gère l'équilibre et la coordination des mouvements, et aide à automatiser les gestes (faire du vélo, écrire)."],
  tronc:["Tronc cérébral","#7D839E","Il relie le cerveau à la moelle épinière et gère ce qui est vital et automatique : respirer, faire battre ton cœur."]

/* ---------- Réseau de neurones (E1) ---------- */
const NNODES = [[60,60],[160,40],[260,85],[360,40],[470,75],[555,40],[95,175],[205,195],[320,160],[430,195],[540,170]];
let net = {edges:[], pulse:false, msg:""};
function networkHTML(){
  return `<div class="card net"><h3>🔗 Apprendre = connecter : fais travailler ce réseau de neurones</h3>
  <p>Chaque <b>nouvelle info</b> crée une connexion, encore fragile. Chaque <b>réactivation</b> la renforce : le trait s'épaissit, s'illumine, et le message circule. Sans réactivation… elle s'affaiblit.</p>
  <div id="netsvg"></div>
  <div class="row" style="margin-top:10px"><button class="btn teal" onclick="netAdd()">🆕 J'apprends une nouvelle info</button><button class="btn green" onclick="netRe()">🔁 Je réactive</button><button class="btn ghost" onclick="netForget()">😴 Je n'y touche plus</button></div>
  <div id="netmsg" class="mini-fb" style="margin-top:10px"></div></div>`;
}
function drawNet(){
  const box = $("#netsvg"); if(!box) return;
  const col = w => w<3 ? "#7B82B5" : w<6 ? "#F4BE3A" : "#FFE45C";
  const lines = net.edges.map(([a,b,w])=>{ const [x1,y1]=NNODES[a],[x2,y2]=NNODES[b];
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col(w)}" stroke-width="${(1.5+w*1.3).toFixed(1)}" stroke-linecap="round" ${w>=6?'style="filter:drop-shadow(0 0 6px #FFE45C)"':""}/>` +
      (net.pulse ? `<circle r="7" fill="#fff"><animateMotion dur=".9s" fill="freeze" path="M${x1} ${y1} L${x2} ${y2}"/><animate attributeName="opacity" values="1;1;0" dur=".9s" fill="freeze"/></circle>` : ""); }).join("");
  const nodes = NNODES.map(([x,y])=>`<g><path d="M${x-22} ${y-10} L${x} ${y} M${x+20} ${y-14} L${x} ${y} M${x-16} ${y+18} L${x} ${y} M${x+18} ${y+16} L${x} ${y}" stroke="#E2557F" stroke-width="4" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="15" fill="#F7A8C0" stroke="#E2557F" stroke-width="4"/><circle cx="${x}" cy="${y}" r="5" fill="#E2557F"/></g>`).join("");
  const avg = net.edges.length ? net.edges.reduce((s,e)=>s+e[2],0)/net.edges.length : 0;
  box.innerHTML = `<svg viewBox="0 0 620 235">${lines}${nodes}<text x="14" y="226" font-family="Nunito,Arial,sans-serif" font-weight="800" font-size="14" fill="#fff">Connexions : ${net.edges.length} · Solidité : ${"★".repeat(Math.round(avg/2))}${"☆".repeat(4-Math.round(avg/2))}</text></svg>`;
  $("#netmsg").innerHTML = net.msg; net.pulse = false;
}
function netAdd(){
  const cand = [];
  for(let a=0;a<NNODES.length;a++) for(let b=a+1;b<NNODES.length;b++){ const d=Math.hypot(NNODES[a][0]-NNODES[b][0],NNODES[a][1]-NNODES[b][1]); if(d<200 && !net.edges.some(e=>e[0]===a&&e[1]===b)) cand.push([a,b]); }
  if(!cand.length){ net.msg = "🧠 Ton réseau est déjà très connecté ! Maintenant, réactive pour le rendre solide."; drawNet(); return; }
  const [a,b] = cand[Math.floor(Math.random()*cand.length)]; net.edges.push([a,b,1]);
  net.msg = "🆕 Une nouvelle connexion se crée… mais elle est encore <b>fragile</b> (trait fin). Que faut-il faire pour la renforcer ?"; drawNet();
}
function netRe(){
  if(!net.edges.length){ net.msg="Il faut d'abord apprendre quelque chose ! Clique sur « J'apprends une nouvelle info »."; drawNet(); return; }
  net.edges.forEach(e=>e[2]=Math.min(8,e[2]+1.5)); net.pulse = true;
  const mx = Math.max(...net.edges.map(e=>e[2]));
  net.msg = mx>=6 ? "🌟 Les connexions brillent : elles sont <b>solides</b>. L'information circule comme sur une autoroute !" : "🔁 Le message circule et les connexions s'épaississent. Encore une réactivation ?"; drawNet();
}
function netForget(){
  net.edges.forEach(e=>e[2]-=2); net.edges = net.edges.filter(e=>e[2]>0);
  net.msg = "🍂 Sans réactivation, les connexions s'affaiblissent et certaines disparaissent : c'est <b>l'oubli</b>."; drawNet();
}

/* ---------- Stroop (E3) ---------- */
const COLS = [["ROUGE","#D93A3A"],["BLEU","#2F6FD6"],["VERT","#1F8F4A"],["VIOLET","#7A3FD1"]];
let stp = null;
function stroopHTML(){
  const r = S.act.stroop || {};
  return `<div class="card"><span class="tag">Test de labo n°1</span><h2 style="margin-top:8px">🎨 Le défi des couleurs</h2>
  <p>Clique sur la <b>couleur de l'encre</b> du mot, <u>pas</u> sur ce qui est écrit. Le chrono tourne ! Fais d'abord la manche 1, puis la manche 2.</p>
  <div class="lab" id="stlab">
    <p style="margin:0;font-weight:800">Manche 1 : le mot et la couleur sont les mêmes · Manche 2 : ils sont différents</p>
    <div class="row" style="justify-content:center;margin-top:14px"><button class="btn yellow" style="background:var(--yellow);color:var(--ink)" onclick="stStart(1)">▶ Manche 1</button><button class="btn" style="background:#fff;color:var(--ink)" onclick="stStart(2)">▶ Manche 2</button></div>
  </div>
  <div class="res-bars" id="stres">${stroopRes(r)}</div></div>`;
}
function stroopRes(r){
  if(!r.t1 && !r.t2) return "";
  const mx = Math.max(r.t1||0,r.t2||0,1);
  let h = "";
  if(r.t1) h += `<div class="bar"><span>Manche 1</span><div class="b" style="width:${r.t1/mx*100}%;background:var(--teal)"></div><span>${r.t1.toFixed(1).replace(".",",")} s</span></div>`;
  if(r.t2) h += `<div class="bar"><span>Manche 2</span><div class="b" style="width:${r.t2/mx*100}%;background:var(--pink)"></div><span>${r.t2.toFixed(1).replace(".",",")} s</span></div>`;
  if(r.t1&&r.t2) h += `<div class="fb ${r.t2>r.t1?"ok":"ok"}">🧠 Manche 2 : ${r.t2>r.t1?`<b>+${(r.t2-r.t1).toFixed(1).replace(".",",")} s</b>`:"presque pareil"}, ${r.e2||0} erreur(s). Ta lecture est <b>automatisée</b> : ton cerveau lit le mot sans le vouloir ! Pour donner la couleur, ton <b>attention sélective</b> doit bloquer cette lecture automatique : c'est un effort, donc c'est plus lent.</div>`;
  return h;
}
function stStart(m){
  const items = [];
  for(let i=0;i<10;i++){ const w=Math.floor(Math.random()*4); let c=w; if(m===2){ do{c=Math.floor(Math.random()*4);}while(c===w);} items.push([w,c]); }
  stp = {m, items, i:0, err:0, t0:performance.now()};
  stShow();
}
function stShow(){
  const [w,c] = stp.items[stp.i];
  $("#stlab").innerHTML = `<p style="margin:0;font-weight:800">Manche ${stp.m} · mot ${stp.i+1}/10 · Clique sur la couleur de l'ENCRE</p>
  <div class="word" style="color:${COLS[c][1]}">${COLS[w][0]}</div>
  <div class="cbtns">${COLS.map((x,k)=>`<button style="background:${x[1]}" onclick="stAns(${k})">${x[0].charAt(0)+x[0].slice(1).toLowerCase()}</button>`).join("")}</div>`;
}
function stAns(k){
  const [,c] = stp.items[stp.i];
  if(k!==c){ stp.err++; const wd=document.querySelector("#stlab .word"); wd.classList.add("shake"); setTimeout(()=>wd.classList.remove("shake"),350); return; }
  stp.i++;
  if(stp.i>=10){
    const t=(performance.now()-stp.t0)/1000; S.act.stroop = S.act.stroop||{}; S.act.stroop["t"+stp.m]=t; S.act.stroop["e"+stp.m]=stp.err; save();
    $("#stlab").innerHTML = `<p style="font-weight:800;font-size:1.2rem;margin:6px 0">Manche ${stp.m} terminée en ${t.toFixed(1).replace(".",",")} s (${stp.err} erreur(s))</p><div class="row" style="justify-content:center"><button class="btn" style="background:var(--yellow);color:var(--ink)" onclick="stStart(1)">▶ Manche 1</button><button class="btn" style="background:#fff;color:var(--ink)" onclick="stStart(2)">▶ Manche 2</button></div>`;

/* ---------- Trail (E3) ---------- */
const LET = "ABCDEFGHIJKL".split("");
let tr = null;
function trailHTML(){
  return `<div class="card"><span class="tag">Test de labo n°2</span><h2 style="margin-top:8px">🔀 Le défi du multitâche</h2>
  <p>Clique sur les ronds <b>dans l'ordre</b>, le plus vite possible. Manche 1 : <b>1 → 12</b>. Manche 2 : <b>A → L</b>. Manche 3 : <b>en alternant</b> chiffres et lettres : 1 → A → 2 → B → 3 → C… jusqu'à F.</p>
  <div class="row"><button class="btn small teal" onclick="trStart(1)">▶ Manche 1 : chiffres</button><button class="btn small teal" onclick="trStart(2)">▶ Manche 2 : lettres</button><button class="btn small pink" onclick="trStart(3)">▶ Manche 3 : alternance</button><span id="trinfo" class="muted" style="font-weight:800"></span></div>
  <div class="trail" id="trail"><p class="muted" style="text-align:center;margin-top:140px">Choisis une manche pour commencer ⤴</p></div>
  <div class="res-bars" id="trres">${trailRes(S.act.trail||{})}</div></div>`;
}
function trailRes(r){
  if(!r.t1&&!r.t2&&!r.t3) return "";
  const mx=Math.max(r.t1||0,r.t2||0,r.t3||0,1); let h="";
  [["Chiffres",r.t1,"var(--teal)"],["Lettres",r.t2,"var(--teal)"],["Alternance",r.t3,"var(--pink)"]].forEach(([n,t,c])=>{ if(t) h+=`<div class="bar"><span>${n}</span><div class="b" style="width:${t/mx*100}%;background:${c}"></div><span>${t.toFixed(1).replace(".",",")} s</span></div>`; });
  if(r.t1&&r.t2&&r.t3){ const moy=(r.t1+r.t2)/2, diff=r.t3-moy; h+=`<div class="fb ok">🧠 En alternant, tu as mis <b>${diff>0?"+"+diff.toFixed(1).replace(".",",")+" s":"à peu près autant"}</b> par rapport à la moyenne d'une tâche simple${diff>0?` (soit ${Math.round(diff/moy*100)} % de plus)`:""}, pour le même nombre de ronds. Chaque changement de tâche oblige ton cerveau à « recharger » la règle : c'est le <b>coût du multitâche</b>. Imagine ça avec une révision et des notifications !</div>`; }
  return h;
}
function trStart(m){
  const seq = m===1 ? Array.from({length:12},(_,i)=>String(i+1)) : m===2 ? LET.slice() : [1,"A",2,"B",3,"C",4,"D",5,"E",6,"F"].map(String);
  const box = $("#trail"); const W = box.clientWidth-56, H = box.clientHeight-56;
  const pos=[]; let guard=0;
  while(pos.length<seq.length && guard<4000){ guard++; const x=Math.random()*W+4, y=Math.random()*H+4; if(pos.every(p=>Math.hypot(p[0]-x,p[1]-y)>64)) pos.push([x,y]); }
  while(pos.length<seq.length) pos.push([Math.random()*W,Math.random()*H]);
  tr = {m, seq, i:0, err:0, t0:null};
  box.innerHTML = shuffle(seq.map((s,k)=>[s,pos[k]])).map(([s,[x,y]])=>`<button class="dot" style="left:${x}px;top:${y}px" data-v="${s}" onclick="trClick(this)">${s}</button>`).join("");
  $("#trinfo").textContent = `Manche ${m} — prochain : ${seq[0]}`;
}
function trClick(b){
  if(!tr) return;
  if(b.dataset.v===tr.seq[tr.i]){ if(tr.t0===null) tr.t0=performance.now(); b.classList.add("ok"); b.disabled=true; tr.i++;
    if(tr.i===tr.seq.length){ const t=(performance.now()-tr.t0)/1000 + 0.4; S.act.trail=S.act.trail||{}; S.act.trail["t"+tr.m]=t; save(); $("#trinfo").textContent=`✅ Manche ${tr.m} : ${t.toFixed(1).replace(".",",")} s (${tr.err} erreur(s))`; $("#trres").innerHTML=trailRes(S.act.trail); tr=null; }
    else $("#trinfo").textContent = `Manche ${tr.m} — prochain : ${tr.seq[tr.i]}`;
  } else { tr.err++; b.classList.add("bad"); setTimeout(()=>b.classList.remove("bad"),300); }
}

const IMG = {};
function loadImgs(cb){
  if(IMG.ready){ cb(); return; }
  let n=0; const done=()=>{ if(++n===2){ IMG.ready=true; cb(); } };
  IMG.m = new Image(); IMG.m.onload=done; IMG.m.onerror=done;
  IMG.m.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(mascot().replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" width="244" height="244" '));
  IMG.l = new Image(); IMG.l.onload=done; IMG.l.onerror=done; IMG.l.src = LOGO_SRC;
}
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function wrap(ctx,text,x,y,maxW,lh,maxLines){
  const words = String(text).split(/\s+/); let line="", lines=[];
  for(const w of words){ const test = line ? line+" "+w : w; if(ctx.measureText(test).width>maxW && line){ lines.push(line); line=w; } else line=test; }
  if(line) lines.push(line);
  if(lines.length>maxLines){ lines = lines.slice(0,maxLines); lines[maxLines-1] = lines[maxLines-1].replace(/\s*\S*$/,"")+" …"; }
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lh)); return lines.length;
}
const FONT = (w,s) => `${w} ${s}px Fredoka, Nunito, "Segoe UI", Arial, sans-serif`;
function drawCard(cv, id){
  const e = ESCALES.find(x=>x.id===id), C = CARTES[id], c = carteOf(id);

  const strong = {e1:"#139C9E",e2:"#2E9E5B",e3:"#6D4BD8",e4:"#E2557F"}[id], soft = {e1:"#E6F7F6",e2:"#E9F6EE",e3:"#F1ECFD",e4:"#FDEAF0"}[id];
  ctx.fillStyle="#FBF6EE"; ctx.fillRect(0,0,W,H);
  rr(ctx,16,16,W-32,H-32,36); ctx.fillStyle=soft; ctx.fill();
  // bandeau
  rr(ctx,16,16,W-32,150,36); ctx.fillStyle=strong; ctx.fill(); ctx.fillRect(16,120,W-32,46);
  ctx.fillStyle="#fff"; ctx.textBaseline="alphabetic"; ctx.textAlign="left";
  ctx.font=FONT(800,24); ctx.fillText(`🗺️ CARTE SYNTHÈSE · MISSION ${e.num}`,60,66);
  ctx.font=FONT(700,48); ctx.fillText(e.title,60,128);
  ctx.textAlign="right"; ctx.font=FONT(800,26); ctx.fillText(`Agent ${S.name||""}`,W-190,80);
  ctx.font=FONT(600,22); ctx.fillText(new Date().toLocaleDateString("fr-FR"),W-190,116);
  if(IMG.l && IMG.l.complete && IMG.l.naturalWidth){ ctx.save(); ctx.beginPath(); ctx.arc(W-100,92,62,0,Math.PI*2); ctx.fillStyle="#fff"; ctx.fill(); ctx.clip(); ctx.drawImage(IMG.l,W-162,30,124,124); ctx.restore(); }
  // positions des branches
  const B = [[56,200],[W-56-570,200],[56,590],[W-56-570,590]], BW=570, BH=330, cx=W/2, cy=575;
  // liens
  B.forEach(([x,y],i)=>{ const tx = i%2===0 ? x+BW : x, ty = y+BH/2;
    ctx.strokeStyle=BRCOL[i]; ctx.lineWidth=14; ctx.lineCap="round"; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.bezierCurveTo((cx+tx)/2,cy,(cx+tx)/2,ty,tx,ty); ctx.stroke(); });
  // centre
  ctx.beginPath(); ctx.arc(cx,cy,158,0,Math.PI*2); ctx.fillStyle="#fff"; ctx.fill(); ctx.lineWidth=10; ctx.strokeStyle=strong; ctx.stroke();
  if(IMG.m && IMG.m.complete && IMG.m.naturalWidth) ctx.drawImage(IMG.m,cx-62,cy-150,124,124);
  ctx.fillStyle="#1F2544"; ctx.textAlign="center"; ctx.font=FONT(700,32); wrap(ctx,C.center,cx,cy+18,260,38,3);
  ctx.font="84px serif"; ctx.fillText(c.st||"🧠",cx,cy+262);
  // boîtes
  ctx.textAlign="left";
  B.forEach(([x,y],i)=>{ const b=C.br[i];
    ctx.save(); ctx.shadowColor="rgba(31,37,68,.12)"; ctx.shadowBlur=18; ctx.shadowOffsetY=6; rr(ctx,x,y,BW,BH,26); ctx.fillStyle="#fff"; ctx.fill(); ctx.restore();
    rr(ctx,x,y,BW,BH,26); ctx.lineWidth=5; ctx.strokeStyle=BRCOL[i]; ctx.stroke();
    rr(ctx,x,y,BW,64,26); ctx.fillStyle=BRCOL[i]; ctx.fill(); ctx.fillRect(x,y+38,BW,26);
    ctx.fillStyle="#fff"; ctx.font=FONT(700,30); ctx.fillText(`${b.i}  ${b.t}`,x+24,y+44);
    const txt = (c.b[i]||"").trim();
    ctx.fillStyle = txt ? "#1F2544" : "#A4A8BD"; ctx.font = FONT(txt?600:600, 26);
    wrap(ctx, txt || b.p, x+24, y+104, BW-48, 34, 7); });
  // phrase à retenir
  rr(ctx,56,956,W-112,92,24); ctx.fillStyle="#FDF3D6"; ctx.fill(); ctx.lineWidth=4; ctx.strokeStyle="#F4BE3A"; ctx.stroke();
  ctx.fillStyle="#1F2544"; ctx.font=FONT(800,28); ctx.fillText("💡 À retenir :",84,1012);
  ctx.font=FONT(700,28); wrap(ctx,(c.phrase||"").trim()||"Ma phrase à retenir…",300,1012,W-112-280,34,2);
  ctx.textAlign="center"; ctx.fillStyle="#636884"; ctx.font=FONT(700,20); ctx.fillText("Classe NeuroVivia · Lycée Isabelle Viviani — Épinal · Mary la prof",W/2,H-22);
}

function hintFor(e,h){
  const q=S.quiz[e.id];
  if(h==="quiz") return q?`📌 Ton résultat : <b>${q.score}/${q.total}</b> ${e.vf?"aux cartes":"au quiz"}.`:`📌 Tu n'as pas encore fait ${e.vf?"les cartes vrai/faux":"le quiz"}.`;
  if(h==="memo"){ const n=(S.memo[e.id]||[]).filter(x=>x&&x.trim()).length; return `📌 Fiche de mémorisation : <b>${n}/${e.memo.length}</b> réponses · Autoroute ${S.act.jungle?"atteinte ✅":"pas encore atteinte"} · Étapes ${S.act.order?"remises en ordre ✅":"pas encore remises en ordre"}.`; }
  if(h==="trad"){ const t=S.act.trad||{}; const sc=Object.keys(t).filter(i=>t[i]===TRAD[i].c).length; return `📌 Traducteur : <b>${sc}/${TRAD.length}</b> · Ma phrase « pas encore » : ${(S.act.my||{}).p?"écrite ✅":"pas encore écrite"} · Action : ${(S.act.my||{}).a?"prévue ✅":"pas encore prévue"}.`; }
  if(h==="plan"){ const p=S.act.plan||{c:[]}; const r=S.act.trail||{}; return `📌 Distracteur n°1 : ${p.d?"identifié ✅":"non rempli"} · ${p.c.length} stratégie(s) choisie(s) · Engagement : ${p.e?"écrit ✅":"non écrit"} · Défi multitâche : ${r.t3?"fait ✅":"pas encore fait"}.`; }
  if(h==="film") return `📌 Film : ${S.act.film?"regardé ✅":"pas encore regardé"} · Publicité : ${AD.filter((a,i)=>a.m&&(S.act.ad||[]).includes(i)).length}/5 allégations trouvées.`;
  return "";
}
function autoHTML(e){
  const a = S.auto[e.id] || {};
  const ready = e.crit.every((_,i)=>a[i]!=null);

  return `<div class="card"><h2>📊 Mon auto-évaluation</h2><p>Pour chaque critère, lis les <b>indicateurs</b> et regarde tes résultats, puis choisis honnêtement ton niveau. Être lucide, c'est déjà apprendre !</p></div>

const RULES = [
  ["🔗","Apprendre, c'est connecter mes neurones… et réactiver souvent."],
  ["🌱","Je ne suis pas nul : je ne maîtrise <u>pas encore</u>."],
  ["🧪","Une erreur corrigée, c'est un apprentissage."],
  ["📵","Une tâche à la fois, téléphone hors de vue."],
  ["🃏","Je me teste, j'espace, je dors."]
];
const stepTag = (ico, txt, cls) => `<div style="text-align:center;margin-bottom:2vh"><span class="tag" style="font-size:clamp(.85rem,1.3vw,1.15rem);padding:6px 16px;${cls==="solo"?"background:var(--teal-soft)":"background:var(--yellow-soft);color:#8A6400"}">${ico} ${txt}</span></div>`;

/* --- briques de diapos --- */
const slTitle = (sub) => `<div style="text-align:center"><div style="width:clamp(130px,18vw,230px);margin:0 auto">${mascot()}</div><span class="tag" style="font-size:clamp(.9rem,1.4vw,1.2rem)">Classe NeuroVivia</span><h1 style="margin-top:.4em">Mon cerveau, mode d'emploi</h1><p class="muted">${sub}</p><div style="display:flex;justify-content:center;margin-top:2vh">${logo(110)}</div></div>`;
const slDeroule = () => `<div>${stepTag("🗓️","Comment ça va se passer ?")}<h2 style="text-align:center">À chaque séance, 3 temps</h2>
  <div class="deroule" style="margin-top:4vh;font-size:clamp(1rem,1.8vw,1.5rem)">
   <div class="dstep proj"><span style="font-size:clamp(2.5rem,5vw,4.5rem)">📽️</span><b style="font-size:clamp(1.2rem,2.2vw,2rem)">1 · Tous ensemble</b><small style="font-size:inherit">On lance la mission au tableau : consignes, vidéo</small></div><div class="darrow">➜</div>
   <div class="dstep solo"><span style="font-size:clamp(2.5rem,5vw,4.5rem)">💻</span><b style="font-size:clamp(1.2rem,2.2vw,2rem)">2 · Seul sur mon poste</b><small style="font-size:inherit">Je fais ma mission : activités, quiz, mémo, auto-évaluation</small></div><div class="darrow">➜</div>
   <div class="dstep proj"><span style="font-size:clamp(2.5rem,5vw,4.5rem)">📽️</span><b style="font-size:clamp(1.2rem,2.2vw,2rem)">3 · Tous ensemble</b><small style="font-size:inherit">On fait le point au tableau</small></div></div></div>`;
const slAffIntro = () => `<div style="text-align:center">${stepTag("📽️","Tous ensemble")}<h1>🙋 Vrai ou faux ?</h1><p>6 affirmations. Pour chacune : <b>levez la main</b> si vous pensez que c'est <span style="color:var(--green);font-weight:800">VRAI</span>.</p><p class="muted">On ne donne pas les réponses tout de suite : on les découvrira à la dernière séance !</p></div>`;
const slAff = (i, canReveal) => () => { const a=AFFIRMATIONS[i]; return `<div><p style="text-align:center;font-weight:800" class="muted">Affirmation ${i+1}/6</p><div class="aff">${a.t}</div>
  <div class="vote"><div style="background:var(--green)">✋ VRAI</div><div style="background:var(--red)">✋ FAUX</div></div>
  ${canReveal ? (V.reveal["a"+i]?`<div class="reveal">${a.r?"✅ VRAI":"❌ FAUX"} — ${a.ex}</div>`:`<div style="text-align:center;margin-top:3vh"><button class="btn pink" onclick="V.reveal['a${i}']=true;renderSlides()">Révéler la réponse</button></div>`) : `<p class="muted" style="text-align:center;margin-top:3vh">Réponse à la séance 5… 🤫</p>`}</div>`; };
const slLaunch = (e) => () => `<div>${stepTag("📽️","Tous ensemble · lancement")}${escaleArt(e)}
  <div class="neura"><div class="av">${mascot()}</div><div class="bub" style="font-size:clamp(1.05rem,1.8vw,1.6rem)"><div class="who">Pr Neura</div>${e.neura}</div></div>
  <div class="probleme" style="margin-top:3vh;font-size:clamp(1.1rem,2vw,1.8rem)">❓ ${e.probleme}</div></div>`;
const slLobes = () => `<div>${stepTag("📽️","Tous ensemble")}<h2 style="text-align:center">🧠 Ton cerveau, vu de côté</h2><div style="font-size:clamp(1rem,1.7vw,1.5rem)">${lobesHTML("pjlob")}</div></div>`;
const slVideo = (k) => () => `<div>${stepTag("📽️","Tous ensemble · vidéo")}<h2 style="text-align:center">🎬 On regarde ensemble</h2>${videoCard(k,true)}<p class="muted" style="text-align:center;margin-top:2vh">Clic sur la vidéo → elle s'ouvre dans un nouvel onglet (passez-la en plein écran).</p></div>`;
const slAVous = (place, steps) => () => `<div>${stepTag("💻","Chacun seul sur son poste","solo")}<div class="avous">
  <div><h1 style="margin-bottom:.3em">💻 À vous !</h1><p>Ouvrez le fichier en mode <b>Élève</b>, puis : <b>${place}</b></p><ol>${steps.map(s=>`<li>${s}</li>`).join("")}</ol>
  <p class="muted">Bloqué ? 📚 Fiche ressource, en haut à droite de la mission.</p></div>
  <div class="card" style="text-align:center"><div class="muted" style="font-weight:800">⏱️ Temps restant</div><div class="cd" id="cdv">${fmt(T.left)}</div>
  <div class="row" style="justify-content:center;margin-top:2vh">${[20,30,35,45].map(m=>`<button class="btn ghost small" onclick="tSet(${m})">${m} min</button>`).join("")}</div>
  <div class="row" style="justify-content:center;margin-top:1.5vh"><button class="btn pink" id="tbtn" onclick="tToggle()">${T.run?"⏸ Pause":"▶ Lancer le minuteur"}</button></div></div></div></div>`;
const slPoint = (e) => () => `<div>${stepTag("📽️","Tous ensemble · on fait le point")}<h2 class="att-h">On fait le point : qui peut répondre ?</h2>
  ${e.memo.map((m,i)=>`<div class="pt-q"><div class="qt">${i+1}. ${m.q}</div>${V.reveal[e.id+i]?`<div class="an">👩‍🔬 ${m.m}</div>`:`<button class="btn ghost small" style="margin-top:1vh" onclick="V.reveal['${e.id+i}']=true;renderSlides()">Révéler la réponse</button>`}</div>`).join("")}</div>`;
const slRules = (idx, title) => () => `<div><h2 class="att-h">${title}</h2><div class="rules">${idx.map(i=>`<div><span>${RULES[i][0]}</span><b style="font-weight:800">${RULES[i][1]}</b></div>`).join("")}</div></div>`;
const slFilm = () => `<div id="projfilm">${stepTag("📽️","Tous ensemble · le film")}<h2 style="text-align:center">🎬 La pire stratégie d'étude</h2><div class="film" style="max-width:1100px;margin:0 auto"><div class="screen" id="screen" style="font-size:clamp(1rem,1.6vw,1.4rem)"></div><div class="ctrl"><button onclick="filmNav(-1)">◀</button><button id="fplay" onclick="filmPlay()">▶ Lecture</button><button onclick="filmNav(1)">▶▶</button><div class="track"><div id="ftrack"></div></div><span id="fnum" style="font-weight:800"></span></div></div></div>`;
const slProj = () => `<div>${stepTag("📽️","Tous ensemble")}<h2 style="text-align:center">🔦 L'attention, un projecteur</h2><div style="font-size:clamp(1rem,1.7vw,1.5rem)">${projectorHTML("pjspot")}</div></div>`;
let SC = null;
function scNew(r){ const it=[]; for(let i=0;i<8;i++){ const w=Math.floor(Math.random()*4); let c=w; if(r===2){ do{c=Math.floor(Math.random()*4);}while(c===w);} it.push([w,c]); } SC={r,i:0,it}; renderSlides(); }
const slStroop = () => { if(!SC) SC={r:1,i:0,it:[[0,0],[1,1],[2,2],[3,3],[1,1],[0,0],[3,3],[2,2]]};
  const [w,c]=SC.it[SC.i];
  return `<div>${stepTag("📽️","Tous ensemble · expérience")}<h2 style="text-align:center">🎨 Toute la classe, à voix haute : dites la <u>COULEUR</u> de l'encre !</h2>
  <div class="collword" style="color:${COLS[c][1]}">${COLS[w][0]}</div>
  <div class="row" style="justify-content:center"><span style="font-weight:800">Manche ${SC.r} · mot ${SC.i+1}/8</span>
  <button class="btn" onclick="SC.i=(SC.i+1)%8;renderSlides()">Mot suivant ➜</button><button class="btn ghost small" onclick="scNew(1)">Manche 1 (facile)</button><button class="btn pink small" onclick="scNew(2)">Manche 2 (pièges !)</button></div>
  <p class="muted" style="text-align:center;margin-top:2vh">Pourquoi la manche 2 est-elle plus difficile ? Vous mesurerez votre temps tout à l'heure, sur votre poste.</p></div>`; };

function seanceSlides(id){
  const E = k => ESCALES.find(e=>e.id===k);
  const stepsEsc = e => ["🎯 Mission","🔍 Découvrir","🧪 Activités", e.vf?"⚡ Vrai ou faux":"⚡ Quiz","📝 Fiche de mémorisation","🗺️ Carte synthèse → 💾 je l'enregistre","📊 Auto-évaluation → 🏅 badge"];
  if(id==="s1") return [()=>slTitle("Comment apprend-on ? Est-on « nul pour la vie » ? L'attention, ça se travaille ? Et toutes ces idées fausses sur le cerveau…"), slDeroule, slAffIntro, ...AFFIRMATIONS.map((_,i)=>slAff(i,false)), slLaunch(E("e1")), slLobes, slVideo("canotech"),
    slAVous("« Départ » puis Mission 1", ["🚪 Mes idées de départ (6 affirmations)", ...stepsEsc(E("e1"))]), slPoint(E("e1")), slRules([0],"La règle d'or n°1")];
  if(id==="s2") return [slLaunch(E("e2")), slVideo("masson"), slAVous("Mission 2", stepsEsc(E("e2"))), slPoint(E("e2")), slRules([1,2],"Les règles d'or n°2 et n°3")];
  if(id==="s3") return [slLaunch(E("e3")), slStroop, slProj, slAVous("Mission 3", stepsEsc(E("e3"))), slPoint(E("e3")), slRules([3],"La règle d'or n°4")];
  if(id==="s4") return [slLaunch(E("e4")), slFilm, slAVous("Mission 4", stepsEsc(E("e4"))), slPoint(E("e4")), slRules([4],"La règle d'or n°5")];
  if(id==="s5") return [()=>`<div style="text-align:center">${stepTag("📽️","Tous ensemble")}<h1>🔁 Le grand retour</h1><p>On revote sur les 6 affirmations de la séance 1… et cette fois, on révèle les réponses !</p></div>`, ...AFFIRMATIONS.map((_,i)=>slAff(i,true)),
    slAVous("Clôture · Mon contrat d'agent", ["🔁 Je réponds à nouveau aux 6 affirmations","🧰 Je choisis mes 3 stratégies","🃏 Je teste ma mémoire","📊 Je regarde mon bilan","🏅 Je signe mon contrat et j'imprime mon certificat"]),
    slRules([0,1,2,3,4],"Les 5 règles d'or de l'agent NeuroVivia"), ()=>slTitle("Bravo, Agents ! Vous connaissez le mode d'emploi de votre cerveau.")];
  return [];
}
function menuHTML(){
  return `<div><div class="row" style="justify-content:center;gap:2vw">${logo(90)}<div style="width:90px">${mascot()}</div></div>
  <h1 style="text-align:center;margin-top:2vh">📽️ Mode projection</h1>
  <p style="text-align:center" class="muted">Choisissez la séance du jour. Chaque séance : <b>📽️ ensemble</b> (lancement) → <b>💻 seul</b> (mission sur poste) → <b>📽️ ensemble</b> (on fait le point).</p>
  <div class="seances">${SEANCES.map(s=>`<button onclick="V.seance='${s.id}';V.slide=0;renderSlides()"><div class="si">${s.icon}</div><b>${s.t}</b><span class="s">${s.s}</span></button>`).join("")}</div></div>`;
}

/* --- minuteur --- */
const T = {left:35*60, run:false, id:null};
const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
function tSet(m){ T.left=m*60; const el=$("#cdv"); if(el) el.textContent=fmt(T.left); }
function tToggle(){
  if(T.run){ clearInterval(T.id); T.run=false; }
  else { T.run=true; T.id=setInterval(()=>{ if(T.left>0) T.left--; const el=$("#cdv"); if(el){ el.textContent=fmt(T.left); el.style.color = T.left<=120?"var(--red)":""; } if(T.left===0){ clearInterval(T.id); T.run=false; } },1000); }
  const b=$("#tbtn"); if(b) b.textContent = T.run?"⏸ Pause":"▶ Lancer le minuteur";
}

function renderSlides(){
  let el = document.querySelector(".slides");
  if(!el){ el=document.createElement("div"); el.className="slides"; document.body.appendChild(el); }
  if(fi.timer && !document.querySelector("#projfilm")){ }
  if(!V.seance){
    el.innerHTML = `<div class="stage"><div class="slide">${menuHTML()}</div></div><div class="bar-bottom"><button class="btn ghost small" onclick="setMode('eleve')">✕ Quitter la projection</button><button class="btn ghost small" onclick="fullscreen()">⛶ Plein écran</button><div class="dots"></div></div>`;
    return;
  }
  const L = seanceSlides(V.seance); V.slide = Math.max(0,Math.min(L.length-1,V.slide));
  const se = SEANCES.find(s=>s.id===V.seance);
  el.innerHTML = `<div class="stage"><div class="slide">${L[V.slide]()}</div></div>
  <div class="bar-bottom"><button class="btn ghost small" onclick="V.seance=null;renderSlides()">☰ Séances</button><button class="btn ghost small" onclick="fullscreen()">⛶ Plein écran</button>
  <span style="font-weight:800">${se.icon} ${se.t}</span>
  <div class="dots">${L.map((_,i)=>`<i class="${i===V.slide?"on":""}"></i>`).join("")}</div>
  <button class="btn small" onclick="slideGo(-1)">◀</button><span style="font-weight:800">${V.slide+1}/${L.length}</span><button class="btn small pink" onclick="slideGo(1)">▶</button>${logo(40)}</div>`;
  if($("#projfilm")) filmShow();
}
function slideGo(d){ if(fi.timer){clearInterval(fi.timer);fi.playing=false;} if(!V.seance) return; V.slide+=d; renderSlides(); }
function fullscreen(){ try{ if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }catch(e){} }
document.addEventListener("keydown", ev=>{
  if(V.mode!=="proj") return;
  if(ev.target && ["INPUT","TEXTAREA"].includes(ev.target.tagName)) return;
  if(["ArrowRight","PageDown"," "].includes(ev.key)){ ev.preventDefault(); slideGo(1); }
  if(["ArrowLeft","PageUp"].includes(ev.key)){ ev.preventDefault(); slideGo(-1); }
  if(ev.key==="Escape" && !document.fullscreenElement){ if(V.seance){ V.seance=null; renderSlides(); } else setMode("eleve"); }
});

document.getElementById("footlogo").innerHTML = logo(42)+`<span>Classe NeuroVivia · Lycée Isabelle Viviani — Épinal · Conception : <b>Mary la prof</b></span>`;
render();
</script>
</body>
</html>
